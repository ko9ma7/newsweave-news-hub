<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>페이지를 찾을 수 없습니다 · NewsWeave</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07101d;color:#eef5ff;font-family:system-ui,sans-serif}main{width:min(620px,calc(100% - 36px));padding:34px;border:1px solid #ffffff18;border-radius:24px;background:#ffffff08}b{color:#51e6ba}h1{font-size:clamp(36px,8vw,72px);letter-spacing:-.05em;margin:18px 0 10px}p{color:#93a5bd}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}button,a{border:1px solid #ffffff20;border-radius:12px;background:#ffffff0b;color:#eef5ff;padding:11px 15px;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(110deg,#51e6ba,#78a7ff);color:#06121c;border:0;font-weight:800}</style></head><body><main><b>NewsWeave · 404</b><h1>이 경로에는<br>뉴스 저장소가 없습니다.</h1><p>주소가 바뀌었거나 존재하지 않는 페이지입니다. 홈이나 뉴스 모음집으로 이동하세요.</p><div class="actions"><a class="primary" id="home" href="/">홈</a><a id="collections" href="/collections.html">뉴스 모음집</a><button onclick="history.back()">이전 페이지</button></div></main><script>(function(){var p=location.pathname.split('/').filter(Boolean),base=location.hostname.endsWith('github.io')&&p.length?'/'+p[0]+'/':'/';document.getElementById('home').href=base;document.getElementById('collections').href=base+'collections.html';})();</script></body></html>
